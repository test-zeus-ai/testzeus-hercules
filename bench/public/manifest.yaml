# Public demo-app scenarios for Hercules (bench/public).
#
# The four targets are public sites built for test-automation practice. Only their published demo
# credentials are used; nothing registers accounts or submits real personal data, and every flow is
# read-only, validation-only, browser-session-only (XYZ Bank) or ledger-neutral (ParaBank transfers).
#
# Per scenario:
#   file            - path relative to bench/public/scenarios (.feature or TestCase .json)
#   app             - saucedemo | orangehrm | parabank | xyzbank
#   base_url        - passed to `hercules run --base-url`; scenario URLs are paths relative to it
#   expected_status - what a careful human tester would report: passed | failed
#   fail_step       - (failed scenarios) the 1-based step that should fail; a list when more than one
#                     step is a correct place to stop (anything else is "failed for the wrong reason")
#   tags            - app:<name> plus feature areas; filter with `run_public.py --tags`
#   site_status     - available | unavailable (when the site was down while the suite was validated)
#   notes           - what the scenario exercises and why it should pass or fail
#
# Scenarios tagged needs_llm are written in looser natural phrasing (every step is read by a model either way).
# Scenarios tagged negative must fail; they measure false passes.
# `validate.py` replays every scenario with hand-written Playwright locators (no Hercules) and checks
# that it agrees with expected_status and fail_step.

apps:
  saucedemo:
    base_url: "https://www.saucedemo.com"
    site_status: available
  orangehrm:
    base_url: "https://opensource-demo.orangehrmlive.com"
    site_status: available
  parabank:
    base_url: "https://parabank.parasoft.com/parabank/"
    site_status: available
  xyzbank:
    base_url: "https://www.globalsqa.com"
    site_status: available

