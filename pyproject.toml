[project]
name = "testzeus-hercules"
version = "2.0.0"
description = "An open-source QA engine by TestZeus: plain-language end-to-end testing of web apps, APIs and databases, driven by language models, from the command line, a local UI or coding agents."
authors = [{ name = "Shriyansh Agnihotri", email = "shriyansh@testzeus.com" }]
requires-python = ">=3.13,<3.16"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "testzeus_hercules/quality/vendor/axe/LICENSE*"]
keywords = [
    "end-to-end testing",
    "test automation",
    "browser testing",
    "API testing",
    "accessibility",
    "visual testing",
    "LLM",
    "MCP",
    "playwright",
    "Hercules",
    "TestZeus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=13.0.0,<14",
    "playwright>=1.65.2,<1.66",
    "pydantic>=2.14.4,<3",
    "pyyaml>=6.0.1,<7",
    "sqlalchemy>=2.1.9,<3",
    "jsonschema>=4.18,<5",
    "langgraph>=1.2.24,<2",
    "langchain-core>=1.8.4,<2",
    "mcp>=1.30.0,<2",
    "httpx>=0.28.1,<0.29",
    "starlette>=1.10.0,<2",
    "uvicorn>=0.54.0,<1",
    "pypdf>=7.1.1,<8",
    "openpyxl>=3.1.5,<4",
    "jsonpath-ng>=1.16.0,<1.17",
    "openapi-schema-validator>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/test-zeus-ai/testzeus-hercules"
Documentation = "https://github.com/test-zeus-ai/testzeus-hercules/blob/main/docs/guide/index.md"
Repository = "https://github.com/test-zeus-ai/testzeus-hercules"
Issues = "https://github.com/test-zeus-ai/testzeus-hercules/issues"
Changelog = "https://github.com/test-zeus-ai/testzeus-hercules/blob/main/CHANGELOG.md"
Videos = "https://github.com/test-zeus-ai/testzeus-hercules/blob/main/docs/guide/videos.md"

[project.scripts]
hercules = "testzeus_hercules.cli.main:main"
testzeus-hercules = "testzeus_hercules.cli.quickstart:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "coverage>=7.17.3,<8",
    "black>=26.3.1,<27",
    "isort>=5.13.2,<6",
    "pytest-cov>=6.0.0,<8",
    "mypy>=2.4.1,<3",
    "gitchangelog>=3.0.4,<4",
    "mkdocs>=1.6.1,<2",
    "ipdb>=0.13.13,<0.14",
    "twine>=5.1.1,<6",
    "deptry>=0.25.1,<0.26",
    "pytest-rerunfailures>=16.7,<17",
]

[project.optional-dependencies]
# JSONPath and OpenAPI checking became core dependencies in 2.0.1; the extra stays so `pip install 'testzeus-hercules[api]'` still works.
api = []
# Run exported tests on BrowserStack, Sauce Labs or TestMu AI from Hercules (hercules cloud run, the UI's Run on cloud).
cloud = ["pytest>=9.2.0,<10", "pytest-playwright>=0.10.0,<0.11", "Appium-Python-Client>=4,<7"]

[tool.setuptools.packages.find]
include = ["testzeus_hercules*"]

[tool.setuptools.package-data]
testzeus_hercules = ["py.typed"]
"testzeus_hercules.cases" = ["schemas/*.json"]
"testzeus_hercules.perceive" = ["*.js"]
# axe-core (MPL-2.0) is shipped unmodified with its licence files; see quality/vendor/axe/VERSION.
"testzeus_hercules.quality" = ["*.js", "vendor/axe/*"]
# The tester UI, built by scripts/build_ui.sh (ui/ -> testzeus_hercules/ui/static) before packaging.
"testzeus_hercules.ui" = ["static/*", "static/assets/*"]
# Example cases and environments written into a project when the daemon starts (testzeus_hercules/seeds).
"testzeus_hercules.seeds" = ["cases/*/*.feature", "envs/*.json"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# The cloud extra installs pytest-playwright for exported tests; they run in a pytest of their own, so its
# fixtures (base_url from pytest-base-url, page, ...) stay out of Hercules's own test suite.
addopts = "-p no:playwright -p no:base_url"
markers = [
    "live: end-to-end tests that need real LLM credentials and a browser (deselect offline with -m 'not live')",
]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["testzeus_hercules"]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = false

[tool.ruff]
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
lint.ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "ANN102",  # Missing type annotation for self in method
    "ANN101",  # Missing type annotation for argument
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
]
lint.mccabe = { max-complexity = 10 }
exclude = [
    ".venv/"
]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

# Minimum safe versions of transitive dependencies (security advisories). These are constraints, not
# overrides: an override would replace a dependency's own requirement (pypdf's <7 cap, for example), while
# a constraint only narrows it. Names that are not in the dependency tree are ignored.
[tool.uv]
constraint-dependencies = [
    "langgraph-sdk>=0.4.6",
    "PyJWT>=2.15.0",
    "multidict>=6.9.1",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "pyasn1>=0.6.5",
    "soupsieve>=4.0.0",
    "aiohttp>=3.14.4",
    "urllib3>=2.8.0",
    "fonttools>=4.61.0",
    "requests>=2.32.5",
    "protobuf>=6.33.5",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.26",
]
