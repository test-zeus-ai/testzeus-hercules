<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean fixture</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.4 Arial, sans-serif; background: #ffffff; color: #111111; }
  button { font-size: 16px; padding: 10px 16px; background: #1f5fa8; color: #ffffff; border: 0; }
  button:focus-visible { outline: 3px solid #111111; outline-offset: 2px; }
  a { color: #1a4f8b; }
  a:focus-visible { outline: 3px solid #111111; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Account</h1>
  <p>Everything on this page meets WCAG 2.2 AA.</p>
  <label for="name">Name</label>
  <input id="name" type="text" autocomplete="name">
  <button id="save" type="button">Save</button>
  <p><a href="#help">Read the help</a></p>
  <img src="team-photo.svg" alt="The support team" width="120" height="80">
  <h2 id="help">Help</h2>
  <p>Contact the support team.</p>
</main>
</body>
</html>
