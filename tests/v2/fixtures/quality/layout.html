<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.4 Arial, sans-serif; background: #ffffff; color: #111111; }
  .promo { position: relative; padding: 8px 0; }
  .promo-cta { display: block; max-width: 360px; height: 40px; padding: 10px 12px; background: #1f5fa8; color: #ffffff; }
  .promo-close { position: absolute; top: 8px; right: 0; width: 40px; height: 40px; }
  .badge { width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 16px; }
  .order-ref { width: 100px; padding: 0 4px; white-space: nowrap; overflow: hidden; margin-top: 8px; font-family: monospace; }
  .toolbar { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 16px; }
  .toolbar button { flex-shrink: 0; width: 120px; height: 40px; }
</style>
</head>
<body>
  <div class="promo">
    <a class="promo-cta" id="cta" href="#trial">Start your free trial</a>
    <button class="promo-close" id="close" aria-label="Close promotion">x</button>
  </div>
  <div class="badge" id="badge">Free shipping on every order</div>
  <div class="order-ref" id="order-ref">ORDER_2024_000123456789</div>
  <div class="toolbar" id="toolbar">
    <button id="t1">Bold</button>
    <button id="t2">Italic</button>
    <button id="t3">Underline</button>
    <button id="t4">Link</button>
  </div>
</body>
</html>
